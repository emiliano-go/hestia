services:
  home:
    build: .
    image: home:latest
    ports:
      - "8080:8080"
    volumes:
      - home-data:/data
    environment:
      # At least one provider key, matching the api_key_env you configure:
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      # Optional; raises GitHub REST rate limits and enables private repos:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/projects')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  home-data:
