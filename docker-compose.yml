services:
  home:
    build: .
    image: home:latest
    ports:
      - "8080:8080"
    volumes:
      - home-data:/data
    # The host pins container DNS to 172.17.0.1 in /etc/docker/daemon.json, which
    # is unreachable from this user-defined network. Override with HOME_DNS if the
    # defaults are blocked on your network.
    dns:
      - ${HOME_DNS:-1.1.1.1}
      - 8.8.8.8
    environment:
      # At least one provider key, matching the api_key_env you configure:
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      # Optional; raises GitHub REST rate limits and enables private repos:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Optional; set to enable passkey login (see README):
      HOME_SETUP_TOKEN: ${HOME_SETUP_TOKEN:-}
      HOME_RP_ID: ${HOME_RP_ID:-}
      HOME_ORIGIN: ${HOME_ORIGIN:-}
      # Optional; push notifications (ntfy and/or Telegram):
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/auth/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  home-data:
